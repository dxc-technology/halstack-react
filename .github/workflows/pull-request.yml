name: Build and test

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js 22.x
        uses: actions/setup-node@v1
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Build library and website
        env:
          NEXT_PUBLIC_SITE_VERSION: next
        run: npm run build

      - name: Test library
        run: npm run test

      - name: Test library accessibility
        run: npm run test:accessibility

      # - name: Publish NEXT version to npm
      #   run: |
      #     sed -i "s#\"version\": \".*\"#\"version\": \"$(jq -r .version ./packages/lib/package.json)-${GITHUB_SHA:0:7}\"#" ./packages/lib/package.json
      #     cd packages/lib
      #     npm publish --tag next --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Deploy via SFTP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ssh_file.pem

          chmod 600 ~/.ssh/ssh_file.pem

          ssh-keyscan -H -p 22 $SFTP_HOST >> ~/.ssh/known_hosts

          sftp -i ~/.ssh/ssh_file.pem -b - $SFTP_USER@$SFTP_HOST <<EOF
          put -r ./apps/website/out/* halstack/18/
          EOF
