name: Build and test

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js 22.x
        uses: actions/setup-node@v1
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Build library and website
        env:
          NEXT_PUBLIC_SITE_VERSION: next
        run: npm run build

      - name: Test library
        run: npm run test

      - name: Test library accessibility
        run: npm run test:accessibility

      - name: Deploy via SFTP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ssh_file.pem

          chmod 600 ~/.ssh/ssh_file.pem

          ssh-keyscan -H -p 22 $SFTP_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ssh_file.pem $SFTP_USER@$SFTP_HOST "rm -r halstack/18"
          EOF
